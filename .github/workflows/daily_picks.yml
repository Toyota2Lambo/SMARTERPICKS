# ============================================================
# SHARPLINE - Daily Picks Automation
# ============================================================
# This file tells GitHub to run your picks_generator.py script
# every day automatically at 9:00 AM Eastern Time.
#
# You NEVER need to edit this file unless you want to
# change what time the picks generate each day.
#
# The file MUST live at exactly this path in your repo:
#   .github/workflows/daily_picks.yml
# ============================================================

name: Generate Daily Picks

on:
  # ── AUTOMATIC: runs every day at 9am Eastern (2pm UTC) ──
  schedule:
    - cron: '0 14 * * *'

  # ── MANUAL: lets you press a button on GitHub to run it now ──
  # Go to: your repo → Actions tab → "Generate Daily Picks" → "Run workflow"
  workflow_dispatch:

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    # Give the action permission to commit picks.json back to your repo
    permissions:
      contents: write

    steps:

      # Step 1: Download your repo files onto the GitHub server
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python (the language your script is written in)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install the two libraries your script needs
      - name: Install dependencies
        run: pip install requests

      # Step 4: Run your picks generator script
      # The secrets come from GitHub → Settings → Secrets (see README Step 4)
      - name: Generate today's picks
        env:
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python picks_generator.py

      # Step 5: Save the new picks.json back to your repo
      # This triggers Vercel to auto-deploy your updated site
      - name: Commit and push updated picks
        run: |
          git config --local user.email "picks-bot@sharpline.com"
          git config --local user.name  "Sharpline Picks Bot"
          git add picks.json
          git diff --staged --quiet || git commit -m "picks: $(date +'%Y-%m-%d') auto-update"
          git push

      # Step 6: Confirm it worked
      - name: Done
        run: echo "✅ Picks updated successfully for $(date +'%A, %B %d, %Y')"
