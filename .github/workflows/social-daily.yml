name: Social — Daily IG Run

# Fires every day AFTER the daily-picks workflow completes successfully.
# That way picks.json / results.json / history.json are all fresh by the
# time the social generator reads them. No fixed schedule — we chain off
# the upstream workflow run so we never beat it to the punch.
#
# Idempotency: daily-picks.yml fires 4 times per morning (04/06/08/11
# UTC) for cron redundancy. Even when its inner work is a no-op (today's
# picks already exist), the workflow still "completes successfully" and
# this workflow gets triggered. To stop the same treatment from posting
# 3-4 times a day, we drop a sentinel file `.morning-published` into the
# day's directory after the first successful publish. Subsequent runs
# see the sentinel and skip the publish step. Generation + render still
# run on every trigger (re-renders are idempotent and inexpensive),
# only the IG-side publish is gated.
#
# Manual trigger is also supported (workflow_dispatch). Pass
# force_publish=true to bypass the sentinel — useful for re-running
# after editing content.json by hand or for one-off republishes.

on:
  workflow_run:
    workflows: ["Daily Picks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Bypass the sentinel — re-publish even if today's morning batch already shipped."
        required: false
        default: "false"

permissions:
  contents: write
  issues: write       # for the failure-notification step

jobs:
  social:
    runs-on: ubuntu-latest
    # Skip if the upstream Daily Picks run failed — no point posting
    # social about stale or missing data.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install anthropic pydantic requests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        # Puppeteer downloads its own Chromium build during install, so
        # CI doesn't need a pre-installed browser.
        run: npm install puppeteer

      - name: Resolve today's directory + check publish state
        id: today
        # The sentinel is `social/YYYY-MM-DD/.morning-published`. If it
        # already exists, today's morning batch was already shipped and
        # we should not double-post (unless the manual trigger overrides
        # via force_publish=true). Generation + render still run either
        # way — they're idempotent and useful for keeping content.json
        # fresh in case picks shifted intra-day.
        run: |
          DAY=$(date -u +'%Y-%m-%d')
          DAY_DIR="social/$DAY"
          SENTINEL="$DAY_DIR/.morning-published"
          FORCE='${{ github.event.inputs.force_publish }}'
          echo "DAY=$DAY"           >> "$GITHUB_OUTPUT"
          echo "DAY_DIR=$DAY_DIR"   >> "$GITHUB_OUTPUT"
          echo "SENTINEL=$SENTINEL" >> "$GITHUB_OUTPUT"
          if [ -f "$SENTINEL" ] && [ "$FORCE" != "true" ]; then
            echo "🔒 Sentinel present at $SENTINEL — morning batch already shipped today."
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_OUTPUT"
          else
            if [ "$FORCE" = "true" ]; then
              echo "🔓 force_publish=true — bypassing sentinel."
            else
              echo "✅ No sentinel yet — first social-daily run today."
            fi
            echo "ALREADY_PUBLISHED=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate content (Claude → content.json)
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          # Used by social/photo_fetcher.py for topic-relevant photo search
          # on photo-aware treatments (quote-card, matchup-card, cover-card,
          # photo-cover-card). Falls back to Picsum if unset.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # photo_fetcher caches downloads here; workflow-scoped so different
          # days don't cross-pollinate. Not committed (workspace path).
          PHOTO_CACHE_DIR:     ${{ github.workspace }}/.photo_cache
        run: python social/social_generator.py

      - name: Render images (templates → PNGs)
        run: node social/renderer.js "${{ steps.today.outputs.DAY_DIR }}/content.json"

      - name: Commit rendered assets
        # Commit BEFORE publishing so the images deploy via Vercel and
        # the IG publisher can fetch them from public URLs.
        #
        # Push uses retry-with-rebase because main can move under us:
        # someone might push a fix while this workflow is rendering,
        # leaving our local main stale. We rebase our single binary
        # commit onto whatever's latest and retry up to 5 times before
        # giving up loudly.
        run: |
          set -euo pipefail
          git config user.name  "smarterpicks-bot"
          git config user.email "smarterpicks-bot@users.noreply.github.com"
          git add "${{ steps.today.outputs.DAY_DIR }}"
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Daily social assets — $(date -u +'%Y-%m-%d')"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main and retrying…"
            git fetch origin main
            # Rebase preserves our single asset commit on top; we never
            # auto-merge to avoid surprise merge commits in history.
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "❌ Could not push assets after 5 attempts — main is moving faster than this workflow can rebase. Re-run manually."
          exit 1

      - name: Publish morning posts (pick carousel + Story 1 + treatments)
        # Idempotency gate: only runs once per day. Subsequent firings
        # (daily-picks repeats at 04/06/08/11 UTC) re-render content.json
        # but skip this step because the sentinel file already exists.
        if: steps.today.outputs.ALREADY_PUBLISHED != '1'
        # The morning run only ships the headline pieces. The four
        # remaining grid/story slots get published throughout the day
        # by .github/workflows/social-stagger.yml on its own cron
        # schedule. See ig_publisher's --only flag for the contract.
        env:
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL:    ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Override only if the deployed origin isn't smarterpicks.io
          IG_PUBLIC_BASE_URL:     ${{ secrets.IG_PUBLIC_BASE_URL }}
        # ig_pick_post     — daily pick carousel (legacy 2-slide site card + CTA)
        # story:1          — morning teaser story
        # treatments       — every modern-template entry as its own standalone
        #                    single-image post. Mode is "post everything, curate
        #                    on Instagram" — the alternative (manual selection)
        #                    was friction we don't want for a daily cadence.
        run: python social/ig_publisher.py "${{ steps.today.outputs.DAY_DIR }}" --only=ig_pick_post,story:1,treatments

      - name: Mark morning batch as published
        # Drops the sentinel file + commits it so the next time this
        # workflow fires (e.g. when the 06/08/11 UTC daily-picks repeat
        # completes), the publish step short-circuits via the SKIP gate.
        # Only runs on the day the publish actually happened — gated by
        # the same ALREADY_PUBLISHED check, plus an implicit success()
        # gate via step ordering (failure() short-circuits subsequent
        # non-always steps).
        if: steps.today.outputs.ALREADY_PUBLISHED != '1'
        run: |
          set -euo pipefail
          SENTINEL="${{ steps.today.outputs.SENTINEL }}"
          touch "$SENTINEL"
          git config user.name  "smarterpicks-bot"
          git config user.email "smarterpicks-bot@users.noreply.github.com"
          git add "$SENTINEL"
          if git diff --cached --quiet; then
            echo "Sentinel already committed — nothing to do."
            exit 0
          fi
          git commit -m "Social: morning batch published — ${{ steps.today.outputs.DAY }}"
          # Same retry-with-rebase pattern as the assets commit. The
          # sentinel is tiny so collisions are rare, but main can still
          # move under us if a daily-pick re-fire commits during publish.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ sentinel pushed on attempt $attempt"
              exit 0
            fi
            echo "Sentinel push rejected on attempt $attempt — rebasing…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "⚠ Could not push sentinel after 5 attempts. The morning batch DID publish, but the sentinel didn't land — next workflow fire may double-publish. Investigate manually."
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today  = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = `Social workflow failed — ${today}`;
            const body   = [
              `The social workflow failed during today's run. The Instagram grid will be missing today's posts until this is resolved.`,
              ``,
              `**Run logs:** ${runUrl}`,
              ``,
              `Common causes:`,
              `- ANTHROPIC_API_KEY exhausted, invalid, or rate-limited`,
              `- IG_ACCESS_TOKEN expired (Meta long-lived tokens last ~60 days; refresh via /me?fields=...&access_token=)`,
              `- IG_BUSINESS_ACCOUNT_ID wrong (verify in Meta Business Suite)`,
              `- Vercel deploy stalled — image URLs didn't 200 within 3 min`,
              `- Puppeteer install failed (rare; usually a CDN hiccup)`,
              `- Claude returned malformed JSON (the parse step rejected it)`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: "open",
              labels: "social-failure",
              per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info(`Issue already exists for ${today} — not re-filing.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body,
              labels: ["social-failure"],
            });
