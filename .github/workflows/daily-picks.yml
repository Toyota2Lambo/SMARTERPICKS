name: Daily Picks

# Runs picks_generator.py once a day and commits the refreshed picks.json.
#
# Schedule: 13:05 UTC every day.
#   - During EDT (Mar-Nov) that's 9:05 AM ET.
#   - During EST (Nov-Mar) that's 8:05 AM ET.
#   If you want it to stay at exactly 9 AM ET year-round, you'd need two
#   cron entries and to live with the DST switch yourself — most people
#   just pick one UTC time and accept the one-hour drift in winter.
#
# You can also trigger it manually from the Actions tab via "Run workflow".

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # notify-on-failure step opens an issue

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python picks_generator.py

      - name: Commit updated data files
        # Retry-with-rebase: if someone pushed to main between checkout
        # and our push, rebase our single data commit and try again.
        # Without this, a same-minute push fails the whole run.
        run: |
          set -euo pipefail
          git config user.name  "smarterpicks-bot"
          git config user.email "smarterpicks-bot@users.noreply.github.com"
          git add picks.json results.json history.json archive.json
          if git diff --cached --quiet; then
            echo "No data files changed — nothing to commit."
            exit 0
          fi
          git commit -m "Daily picks update — $(date -u +'%Y-%m-%d')"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main and retrying…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "❌ Could not push data after 5 attempts. Re-run manually."
          exit 1

      # If anything above this step failed, file an issue so we hear about
      # it instead of finding out from a confused member. Uses GITHUB_TOKEN —
      # no extra secrets to configure.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today  = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = `Daily picks workflow failed — ${today}`;
            const body   = [
              `The daily picks workflow failed during today's run. The site likely shows stale data until this is resolved.`,
              ``,
              `**Run logs:** ${runUrl}`,
              ``,
              `Common causes:`,
              `- ODDS_API_KEY exhausted, invalid, or rate-limited`,
              `- ANTHROPIC_API_KEY exhausted, invalid, or rate-limited`,
              `- The Odds API returned zero games (every configured sport off-season)`,
              `- Claude returned malformed JSON the parser couldn't recover`,
              `- A push to main with a bug in picks_generator.py`,
              ``,
              `Triggered by: workflow run \`${context.runId}\``,
            ].join("\n");

            // Avoid duplicate issues — if today's failure already filed one, skip.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: "open",
              labels: "workflow-failure",
              per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info(`Issue already exists for ${today} — not re-filing.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body,
              labels: ["workflow-failure"],
            });
