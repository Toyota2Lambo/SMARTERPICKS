name: Daily Picks

# Runs every morning at 04:00 UTC (midnight ET in summer, 11pm ET in winter).
# That's BEFORE most US users are awake, so the site shows today's date
# when they visit in the morning.
#
# The job does TWO things, in order:
#   1. score_yesterday.py — reads the existing picks.json (= yesterday's
#      slate since today's hasn't been generated yet), pulls final scores
#      from The Odds API, has Claude grade each pick, writes results.json
#      + appends to history.json. So "yesterday's results" + "track record"
#      stay current automatically.
#   2. picks_generator.py — generates today's new picks and overwrites
#      picks.json.
#
# Both steps run in sequence so the order is correct: yesterday's results
# are captured BEFORE today's picks overwrite the data.
#
# Manual trigger is also supported (workflow_dispatch) for re-running
# after fixing a bug or re-scoring picks.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Score yesterday's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python score_yesterday.py

      - name: Generate today's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python picks_generator.py

      - name: Commit picks + results + history
        run: |
          git config user.name  "smarterpicks-bot"
          git config user.email "smarterpicks-bot@users.noreply.github.com"
          git add picks.json results.json history.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Daily run — $(date -u +'%Y-%m-%d') (picks + yesterday's results + history)"
            git push
          fi
