<style>
  :root{
    --bg:#0a0a0a;--bg-elevated:#131313;--bg-surface:#1a1a1a;
    --border:#2a2a2a;--border-strong:#3a3a3a;
    --text:#f4efe4;--text-muted:#8a8580;--text-dim:#5a5550;
    --accent:#d4a843;--accent-dim:#8a6f2d;
    --win:#6dbe7a;--loss:#d96565;--push:#888;
    --display:"Fraunces","Times New Roman",serif;
    --body:"Inter Tight",-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:"JetBrains Mono","Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");opacity:.035;pointer-events:none;z-index:100;}
  a{color:inherit;}
  .container{max-width:1280px;margin:0 auto;padding:0 32px;}

  /* NAV */
  nav{border-bottom:1px solid var(--border);background:rgba(10,10,10,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:50;}
  .nav-inner{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;max-width:1280px;margin:0 auto;}
  .logo{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);}
  .logo-mark{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);flex-shrink:0;}
  .nav-back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;}
  .nav-back:hover{color:var(--text);}

  /* SLATE */
  .slate{padding:80px 0;border-bottom:1px solid var(--border);}
  .section-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:48px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px;}
  .section-tag{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  .section-title{font-family:var(--display);font-size:44px;font-weight:400;letter-spacing:-.02em;line-height:1.05;}
  .section-title em{font-style:italic;color:var(--accent);}
  .section-meta{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .live-dot{display:inline-block;width:6px;height:6px;background:var(--win);border-radius:50%;margin-right:6px;animation:pulse 2s infinite;vertical-align:middle;}

  /* PICK CARDS */
  .picks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);perspective:1400px;}
  .pick-card{background:var(--bg);padding:32px;transition:transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s cubic-bezier(.2,.7,.2,1), background .25s ease;position:relative;transform-style:preserve-3d;}
  .pick-card:not(.locked):hover{transform:translate3d(0,-4px,0);box-shadow:0 14px 36px rgba(0,0,0,.42);z-index:1;}
  .pick-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .pick-league{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);padding:4px 8px;border:1px solid var(--accent-dim);}
  .pick-icon{margin-right:6px;font-size:12px;line-height:1;display:inline-block;}
  .pick-time{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .pick-matchup{font-family:var(--display);font-size:24px;font-weight:400;line-height:1.2;margin-bottom:4px;}
  .pick-matchup .vs{color:var(--text-dim);font-style:italic;margin:0 5px;}
  .pick-detail{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
  .pick-call{background:var(--bg-surface);padding:18px 20px;margin-bottom:20px;border-left:2px solid var(--accent);}
  .pick-call-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
  .pick-call-value{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text);}
  .pick-call-odds{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:4px;}
  .pick-reasoning{font-size:14px;line-height:1.65;color:var(--text-muted);margin-bottom:20px;}
  .pick-tags{display:flex;gap:8px;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:4px 8px;border:1px solid var(--border);}

  /* CONFIDENCE METER */
  .conf-meter{display:flex;align-items:center;gap:10px;margin:10px 0 18px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);}
  .conf-meter-track{flex:1;height:5px;background:var(--bg-surface);position:relative;overflow:hidden;}
  .conf-meter-fill{position:absolute;inset:0;background:linear-gradient(90deg, var(--accent), var(--win));transform-origin:left center;transform:scaleX(var(--conf, .5));}
  .pick-card.conf-c .conf-meter-fill{background:linear-gradient(90deg, var(--text-dim), var(--accent));}
  .pick-card.conf-a .conf-meter-fill{background:linear-gradient(90deg, var(--accent), var(--win));}
  .conf-label{flex-shrink:0;font-weight:700;color:var(--text);}

  /* LOCKED CARDS */
  .pick-card.locked{overflow:hidden;}
  .pick-blur{filter:blur(5px);pointer-events:none;user-select:none;opacity:.4;}
  .lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,10,.78);backdrop-filter:blur(2px);text-align:center;padding:24px;z-index:2;}
  .lock-icon{font-size:28px;margin-bottom:14px;}
  .lock-title{font-family:var(--display);font-size:22px;font-weight:400;margin-bottom:8px;}
  .lock-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;max-width:24ch;}
  .lock-btn{background:var(--accent);color:#000;padding:13px 22px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;text-decoration:none;transition:all .2s;}
  .lock-btn:hover{background:#e6b950;transform:translateY(-1px);}
  .lock-badge{position:absolute;top:14px;right:14px;background:var(--accent);color:#000;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;z-index:3;}
  @keyframes premiumGlow{
    0%,100%{box-shadow:0 0 0 1px rgba(212,168,67,.30), 0 0 22px rgba(212,168,67,.10);}
    50%    {box-shadow:0 0 0 1px rgba(212,168,67,.55), 0 0 32px rgba(212,168,67,.22);}
  }
  .pick-card.locked{animation:premiumGlow 4.5s ease-in-out infinite;}

  /* PICK TOOLS (Open in book / Ask Claude) */
  .pick-tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .pick-tool{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
  .pick-tool:hover{border-color:var(--accent);color:var(--text);}
  .pick-tool.primary{border-color:var(--accent-dim);color:var(--accent);}
  .pick-tool.primary:hover{background:var(--accent);color:#000;}

  /* CHAT PANEL */
  .chat-panel{max-height:0;opacity:0;margin-top:0;padding-top:0;border-top:1px solid transparent;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.7,.2,1), opacity .3s ease, padding-top .4s cubic-bezier(.2,.7,.2,1), margin-top .4s cubic-bezier(.2,.7,.2,1), border-color .3s ease;}
  .pick-card.chat-open .chat-panel{max-height:600px;opacity:1;margin-top:14px;padding-top:14px;border-top-color:var(--border);}
  .chat-msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;max-height:280px;overflow-y:auto;}
  .chat-msg{font-size:13px;line-height:1.55;padding:10px 12px;border:1px solid var(--border);}
  .chat-msg.user{background:var(--bg-surface);color:var(--text);align-self:flex-end;max-width:82%;}
  .chat-msg.assistant{background:transparent;color:var(--text);max-width:100%;}
  .chat-msg.error{border-color:rgba(217,101,101,.4);color:var(--loss);font-family:var(--mono);font-size:11px;}
  .chat-typing{display:inline-flex;gap:4px;align-items:center;}
  .chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:chatBounce 1.2s infinite ease-in-out;}
  .chat-typing span:nth-child(2){animation-delay:.15s;}
  .chat-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes chatBounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-3px);opacity:1;}}
  .chat-suggest{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chat-chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-muted);cursor:pointer;transition:all .2s;}
  .chat-chip:hover{border-color:var(--accent);color:var(--text);}
  .chat-form{display:flex;gap:6px;}
  .chat-input{flex:1;background:var(--bg-surface);border:1px solid var(--border);padding:10px 12px;color:var(--text);font-family:var(--body);font-size:13px;outline:none;transition:border-color .2s;}
  .chat-input:focus{border-color:var(--accent);}
  .chat-send{background:var(--accent);color:#000;border:none;padding:0 14px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s;}
  .chat-send:hover{background:#e6b950;}
  .chat-send:disabled{opacity:.4;cursor:not-allowed;}
  .chat-byline{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-top:8px;text-align:right;}

  /* RESULT REVEAL */
  .result-reveal{position:absolute;top:14px;right:14px;perspective:600px;z-index:4;pointer-events:none;}
  .result-chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;color:#000;}
  .result-chip.won{background:var(--win);}
  .result-chip.lost{background:var(--loss);color:#fff;}
  .result-chip.push{background:var(--text-muted);color:#000;}

  /* SKELETONS */
  @keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
  .skeleton-line{height:14px;background:linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-surface) 50%, var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;margin-bottom:12px;}

  /* FOOTER */
  footer{background:var(--bg);border-top:1px solid var(--border);padding:48px 0;text-align:center;}
  .footer-bottom{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
  .footer-bottom a{color:var(--text-muted);text-decoration:none;margin:0 12px;}
  .footer-bottom a:hover{color:var(--accent);}

  @media(max-width:960px){
    .container{padding:0 20px;}
    .nav-inner{padding:14px 20px;}
    .slate{padding:48px 0;}
    .picks-grid{grid-template-columns:1fr;}
    .section-header{flex-direction:column;gap:10px;}
    .section-title{font-size:32px;}
  }
</style>
</head>
