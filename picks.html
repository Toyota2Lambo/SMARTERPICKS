<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTERPICKS — Today's Picks</title>

<!-- ============================================================
     /picks now redirects to /terminal.
     ------------------------------------------------------------
     The "today's picks" experience moved into the live terminal —
     same picks, plus the live scoreboard, lines, news and injury
     wire all on one page. The terminal gates the per-pick
     reasoning for members only; non-members still get the slate
     count and CTA. All inbound /picks links and bookmarks
     forward automatically.
     ============================================================ -->

<meta http-equiv="refresh" content="0; url=/terminal">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://smarterpicks.io/terminal">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<script>
  // Belt-and-suspenders: meta refresh + JS redirect so the browser
  // never lingers here even if cached aggressively.
  // Preserve any query string (e.g. ?premium=1) onto /terminal.
  (function () {
    var qs = window.location.search || '';
    window.location.replace('/terminal' + qs);
  })();
</script>

<style>
  body {
    background: #0a0a0a;
    color: #d4a843;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
  }
  a { color: #d4a843; }
</style>
</head>
<body>
  <div>
    <p>Today's picks moved to the live terminal.</p>
    <p>Redirecting… <a href="/terminal">Tap here if it doesn't.</a></p>
  </div>
</body>
</html>
