<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Index Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* INDEX CARD — data-dense reference grid.
     Mono eyebrow → italic-serif title → a 3×2 (feed) or 2×3
     (story) grid of stat cells. Each cell is the same atomic
     unit: a small mono label up top, a huge italic-serif number
     mid-cell, and a small mono footnote at the bottom. An italic
     note paragraph below the grid sets the meta-point. Reads
     like the back-of-magazine almanac page or a terminal
     snapshot — maximum receipts, minimum chrome. Use this when
     the credibility lift is the entire point of the post. */

  .stage { padding: 96px; justify-content: flex-start; }
  .brand { margin-bottom: 0; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .idx-eyebrow {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 72px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .idx-eyebrow::before {
    content: "";
    width: 52px;
    height: 1px;
    background: var(--accent);
  }

  .idx-title {
    font-family: var(--display);
    font-weight: 400;
    font-style: italic;
    font-size: 100px;
    line-height: .95;
    letter-spacing: -.03em;
    color: var(--text);
    margin: 32px 0 56px;
    max-width: 18ch;
  }
  .idx-title em {
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .idx-title { font-size: 116px; }

  .idx-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    margin-bottom: 44px;
  }
  body[data-size="story"] .idx-grid {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
  }

  .idx-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 220px;
  }
  body[data-size="story"] .idx-cell { min-height: 280px; }

  .cell-label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .cell-num {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 92px;
    line-height: .95;
    letter-spacing: -.035em;
    color: var(--text);
    margin: 16px 0 12px;
  }
  body[data-size="story"] .cell-num { font-size: 108px; }
  .cell-num.accent { color: var(--accent); }
  .cell-num.win    { color: var(--win); }
  .cell-num.loss   { color: var(--loss); }

  .cell-foot {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .idx-note {
    font-family: var(--display);
    font-style: italic;
    font-size: 32px;
    line-height: 1.3;
    color: var(--text-muted);
    max-width: 30ch;
    margin-bottom: 36px;
  }
  .idx-note em { color: var(--accent); }
</style>
</head>
<body data-size="{{size}}">
  <div class="stage">

    <div class="header-row">
      <div class="brand">
        <img class="brand-mark" src="logo.png" alt="" style="width:auto;height:18px;">
        <span class="brand-name">SMARTERPICKS</span>
      </div>
      <div class="tag">{{tag}}</div>
    </div>

    <div class="idx-eyebrow">{{eyebrow}}</div>
    <div class="idx-title">{{title_html}}</div>

    <div class="idx-grid">
      {{index_cells_html}}
    </div>

    <div class="idx-note">{{note_html}}</div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      <span class="promo">7-day free trial</span>
    </div>

  </div>
</body>
</html>
