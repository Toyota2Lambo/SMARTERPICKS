<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Stat Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* STAT CARD — single statistic, weaponized.
     One enormous italic-serif number takes 60-70% of the canvas;
     a small mono eyebrow above sets the context; an italic-serif
     caption below tells you why it matters; a mono source line
     receipts it. The number IS the post. Designed to stop the
     thumb cold in the feed — once you've read the digit, you've
     already read the post, and the caption upgrades it from
     attention to comprehension. */

  .stage { padding: 96px; justify-content: flex-start; }
  .brand { margin-bottom: 0; }

  .stat-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin: 80px 0 auto;
  }

  .stat-eyebrow {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 36px;
  }
  .stat-eyebrow::before {
    content: "";
    width: 52px;
    height: 1px;
    background: var(--accent);
  }

  .stat-number {
    font-family: var(--display);
    font-weight: 300;
    font-style: italic;
    font-size: 520px;
    line-height: .82;
    letter-spacing: -.07em;
    color: var(--text);
    margin: 0;
    display: flex;
    align-items: flex-start;
  }
  .stat-number .unit {
    color: var(--accent);
    font-size: .28em;
    margin-left: 14px;
    margin-top: .12em;
    letter-spacing: -.02em;
  }
  body[data-size="story"] .stat-number { font-size: 640px; }

  .stat-caption {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -.02em;
    color: var(--text);
    max-width: 17ch;
    margin-top: 56px;
  }
  .stat-caption em {
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .stat-caption { font-size: 68px; }

  .stat-source {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-source::before {
    content: "";
    width: 24px;
    height: 1px;
    background: var(--text-dim);
  }
</style>
</head>
<body data-size="{{size}}">
  <div class="stage">

    <div class="brand">
      <img class="brand-mark" src="logo.png" alt="" style="width:auto;height:18px;">
      <span class="brand-name">SMARTERPICKS</span>
    </div>

    <div class="stat-wrap">
      <div class="stat-eyebrow">{{eyebrow}}</div>
      <div class="stat-number">{{stat_value}}<span class="unit">{{stat_unit}}</span></div>
      <div class="stat-caption">{{caption_html}}</div>
      <div class="stat-source">{{source}}</div>
    </div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      <span class="promo">7-day free trial</span>
    </div>

  </div>
</body>
</html>
