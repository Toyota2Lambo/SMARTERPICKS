<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Hit Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* HIT CARD — spotlight on a single winning result.
     Structural inspo: PredictIQ's "Yesterday's strongest edge HIT"
     post (banner → boxed callout → final score → 'we saw' reasoning).
     Visual identity: pure SmarterPicks — gold accent (no neon green),
     italic serif Fraunces (no bold caps sans), hairline rules (no
     brushy underlines), clean SVG checkmark (no spray-paint tick).

     Four stacked sections, top to bottom:
       1. Banner headline with gold check ("Yesterday's strongest hit")
       2. Boxed pick callout — winning team's logo + name + line/odds
       3. Final score strip — both teams' logos flanking the score
       4. "We saw" reasoning — single sentence on why we called it

     Use case: hero shot for one specific big win. 1 per day max,
     only when results.json has a clear standout. Skip on losing days. */

  .stage { padding: 80px 64px; justify-content: flex-start; }
  .brand { margin-bottom: 0; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ── 1. BANNER ── */
  .hit-banner {
    text-align: center;
    margin: 48px 0 36px;
  }
  .hit-eyebrow {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }
  .hit-eyebrow::before, .hit-eyebrow::after {
    content: "";
    width: 32px;
    height: 1px;
    background: var(--accent);
  }
  .hit-headline {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 72px;
    line-height: .98;
    letter-spacing: -.025em;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 20px;
    max-width: 18ch;
  }
  .hit-headline em {
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .hit-headline { font-size: 84px; }
  .hit-check {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }
  body[data-size="story"] .hit-check { width: 68px; height: 68px; }

  /* ── 2. PICK CALLOUT ── */
  .hit-callout {
    border: 1px solid var(--accent);
    background: rgba(212, 168, 67, 0.05);
    padding: 28px 32px;
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .hit-callout-logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.45));
    flex-shrink: 0;
  }
  .hit-callout-logo[src=""], .hit-callout-logo:not([src]) { display: none; }
  .hit-callout-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hit-callout-team {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 48px;
    line-height: 1;
    color: var(--text);
    letter-spacing: -.025em;
  }
  .hit-callout-line {
    font-family: var(--display);
    font-style: italic;
    font-weight: 300;
    font-size: 48px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.025em;
  }
  body[data-size="story"] .hit-callout-logo { width: 112px; height: 112px; }
  body[data-size="story"] .hit-callout-team,
  body[data-size="story"] .hit-callout-line { font-size: 56px; }

  /* ── 3. FINAL SCORE STRIP ── */
  .hit-score {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 32px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }
  .hit-score-side {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .hit-score-side.away { justify-content: flex-start; }
  .hit-score-side.home {
    justify-content: flex-end;
    flex-direction: row-reverse;
  }
  .hit-score-logo {
    width: 92px;
    height: 92px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    flex-shrink: 0;
  }
  .hit-score-logo[src=""], .hit-score-logo:not([src]) { display: none; }
  body[data-size="story"] .hit-score-logo { width: 108px; height: 108px; }
  .hit-score-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .hit-score-side.home .hit-score-meta { text-align: right; }
  .hit-score-team {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .hit-score-num {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 64px;
    line-height: 1;
    color: var(--text);
    letter-spacing: -.03em;
  }
  body[data-size="story"] .hit-score-num { font-size: 76px; }
  /* Winning side's score in gold */
  .hit-score-side.winner .hit-score-num { color: var(--accent); }
  .hit-score-pivot {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .hit-score-pivot::before, .hit-score-pivot::after {
    content: "";
    width: 18px;
    height: 1px;
    background: var(--border);
  }

  /* ── 4. WE SAW REASONING ── */
  .hit-reasoning {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 36px;
  }
  .hit-reasoning-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .hit-reasoning-label::before {
    content: "";
    width: 24px;
    height: 1px;
    background: var(--accent);
  }
  .hit-reasoning-text {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.3;
    color: var(--text);
    max-width: 32ch;
  }
  .hit-reasoning-text em {
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .hit-reasoning-text { font-size: 34px; }
</style>
</head>
<body data-size="{{size}}">
  <div class="stage">

    <div class="header-row">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">SMARTERPICKS</span>
      </div>
      <div class="tag">{{tag}}</div>
    </div>

    <!-- 1. BANNER -->
    <div class="hit-banner">
      <div class="hit-eyebrow">{{eyebrow}}</div>
      <div class="hit-headline">
        <span>{{headline_html}}</span>
        <!-- Inline SVG checkmark — circle outline + bold check stroke,
             both in --accent gold. No external icon, no font dep. -->
        <svg class="hit-check" viewBox="0 0 56 56" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="28" r="25" fill="none" stroke="#d4a843" stroke-width="2.5"/>
          <polyline points="17,28 25,37 40,19" fill="none" stroke="#d4a843" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- 2. PICK CALLOUT — winning team logo + name + line -->
    <div class="hit-callout">
      <img class="hit-callout-logo" src="{{pick_team_logo}}" alt="" onerror="this.style.display='none'">
      <div class="hit-callout-text">
        <div class="hit-callout-team">{{pick_team}}</div>
        <div class="hit-callout-line">{{pick_line}}</div>
      </div>
    </div>

    <!-- 3. FINAL SCORE — both teams logos + score, winning side in gold -->
    <div class="hit-score">
      <div class="hit-score-side away {{away_winner_class}}">
        <img class="hit-score-logo" src="{{away_logo}}" alt="" onerror="this.style.display='none'">
        <div class="hit-score-meta">
          <div class="hit-score-team">{{away_team}}</div>
          <div class="hit-score-num">{{away_score}}</div>
        </div>
      </div>
      <div class="hit-score-pivot">Final</div>
      <div class="hit-score-side home {{home_winner_class}}">
        <img class="hit-score-logo" src="{{home_logo}}" alt="" onerror="this.style.display='none'">
        <div class="hit-score-meta">
          <div class="hit-score-team">{{home_team}}</div>
          <div class="hit-score-num">{{home_score}}</div>
        </div>
      </div>
    </div>

    <!-- 4. WE SAW — single-line reasoning -->
    <div class="hit-reasoning">
      <div class="hit-reasoning-label">We saw</div>
      <div class="hit-reasoning-text">{{reasoning_html}}</div>
    </div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      <span class="promo">7-day free trial</span>
    </div>

  </div>
</body>
</html>
