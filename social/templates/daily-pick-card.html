<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Daily Pick Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* daily-pick-card composition: a single editorial card. The renderer
     calls this template once per carousel slide; each call passes
     {{slide_text}} (the body), {{slide_label}} (the small tag), and
     {{slide_index}}/{{slide_total}} (e.g. "1 / 3"). */
  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
    position: relative;
    z-index: 1;
  }
  .slide-headline {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: -.02em;
    line-height: 1.04;
    font-size: 88px;
    color: var(--text);
  }
  .slide-headline em {
    font-style: italic;
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .slide-headline { font-size: 104px; }

  .slide-pager {
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .slide-pager .of { opacity: .5; margin: 0 6px; }
  .slide-pager .num { color: var(--accent); }
</style>
</head>
<body data-size="{{size}}">
  <div class="glow" style="top:-12%;right:-15%;width:520px;height:520px;"></div>
  <div class="stage">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">SMARTERPICKS</span>
    </div>

    <div class="tag">{{slide_label}}</div>

    <div class="card-body">
      <div class="slide-headline">{{slide_text}}</div>
    </div>

    <div class="slide-pager">
      <span class="num">{{slide_index}}</span>
      <span class="of">/</span>
      <span>{{slide_total}}</span>
    </div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      Code <span class="promo">FREE30</span> <span class="dot">·</span>
      1 month free
    </div>
  </div>
</body>
</html>
