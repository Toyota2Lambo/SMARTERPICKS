<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Pick Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* PICK CARD — the workhorse daily play.
     Editorial top-down: brand strip → matchup label (mono) →
     a giant italic-serif declaration of the play → a three-cell
     data row (line / edge / confidence) ruled top and bottom.
     Reads like a sportsbook decided to publish a literary
     magazine: numbers matter, but the typography carries the
     weight. The dramatic scale of the headline is the IG-feed
     thumbstop; the data grid rewards anyone who actually opens
     the post. */

  .stage { padding: 96px; justify-content: flex-start; }
  .brand { margin-bottom: 0; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Prominent team logos in their own row above the matchup label.
     The 28px inline version was too small to register on a scroll —
     bumped to 120px desktop / 140px story so they read as identifiers,
     not favicons. This is the FIRST visual hook for sports-betting
     scrollers: they see logos, know it's their team's game, stop
     scrolling. Brand recognition for non-followers too. */
  .matchup-logos-row {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-top: 72px;
    margin-bottom: 28px;
  }
  .matchup-logos-row img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5));
  }
  .matchup-logos-row img[src=""],
  .matchup-logos-row img:not([src]) {
    display: none;
  }
  body[data-size="story"] .matchup-logos-row img {
    width: 140px;
    height: 140px;
  }

  .matchup-strip {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-muted);
    /* margin-top was 88px when this was the first element under the
       header; now the logos-row owns that spacing. Drop to small. */
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .matchup-strip::before {
    content: "";
    width: 44px;
    height: 1px;
    background: var(--accent);
  }
  .matchup-strip .when { color: var(--accent); }

  .pick-headline {
    font-family: var(--display);
    font-weight: 400;
    font-style: italic;
    font-size: 156px;
    line-height: .9;
    letter-spacing: -.035em;
    color: var(--text);
    margin: 40px 0 0;
    max-width: 13ch;
  }
  .pick-headline em {
    font-style: italic;
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .pick-headline { font-size: 188px; }

  .pick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: auto;
    border-top: 1px solid var(--border);
    margin-bottom: 36px;
  }
  .pick-cell {
    padding: 32px 28px 32px 0;
    border-right: 1px solid var(--border);
  }
  .pick-cell + .pick-cell { padding-left: 28px; }
  .pick-cell:last-child { border-right: 0; }

  .cell-label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .cell-value {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 54px;
    line-height: 1;
    color: var(--text);
    letter-spacing: -.02em;
  }
  .cell-value.accent { color: var(--accent); }
  body[data-size="story"] .cell-value { font-size: 62px; }
</style>
</head>
<body data-size="{{size}}">
  <div class="stage">

    <div class="header-row">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">SMARTERPICKS</span>
      </div>
      <div class="tag">{{tag}}</div>
    </div>

    <!-- Big team logos as the first visual hook under the header.
         Was a tiny inline strip beside mono text; now standalone,
         120px each, scroll-stopping. URLs come from
         social_generator.py → team_logos.py. -->
    <div class="matchup-logos-row">
      <img src="{{away_logo}}" alt="" onerror="this.style.display='none'">
      <img src="{{home_logo}}" alt="" onerror="this.style.display='none'">
    </div>
    <div class="matchup-strip">
      <span>{{matchup}}</span>
      <span class="when">{{game_time}}</span>
    </div>

    <div class="pick-headline">{{pick_headline_html}}</div>

    <div class="pick-grid">
      <div class="pick-cell">
        <div class="cell-label">The Line</div>
        <div class="cell-value">{{line}}</div>
      </div>
      <div class="pick-cell">
        <div class="cell-label">Our Edge</div>
        <div class="cell-value accent">{{edge}}</div>
      </div>
      <div class="pick-cell">
        <div class="cell-label">Confidence</div>
        <div class="cell-value">{{confidence}}</div>
      </div>
    </div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      <span class="promo">7-day free trial</span>
    </div>

  </div>
</body>
</html>
