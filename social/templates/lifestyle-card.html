<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Lifestyle Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* LIFESTYLE CARD — aspirational post, anchored by receipts.
     Different from photo-cover-card: lighter photo treatment (vignette
     only, no heavy gradient — we WANT the luxury visible), copy
     anchored bottom-left without competing with the image. The luxury
     photo carries the aspiration; the headline is always a receipt
     (a number that compounds) so the post reads disciplined on a
     second pass instead of "easy money" promise-land.

     Brand voice gauntlet for the copy:
       - Headline must be a numeric receipt: '+41.9u in 44 days',
         'Compound at 0.85u a day', 'Eight point three percent monthly'.
       - Sub-line is a time horizon: 'Two-fifty trading days a year. Five
         years.', 'Math, not magic. The grind doesn't either.'
       - NEVER write 'this could be yours', 'imagine the life',
         'your future self', 'manifest', or any promise of outcomes.
       - The image implies the lifestyle. The math earns the trust. */

  .stage { padding: 0; }

  .lifestyle-photo {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .lifestyle-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Light treatment. Keep the photo's color + structure since the
       luxury is the visual hook. Just bump contrast a touch. */
    filter: contrast(1.06) brightness(0.94);
  }
  /* Two-band gradient: dark at the very top so the wordmark reads,
     dark at the bottom 35% so the headline lands cleanly. Middle
     band is nearly transparent so the photo stays the protagonist. */
  .lifestyle-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(10,10,10,0.55) 0%,
      rgba(10,10,10,0.10) 18%,
      rgba(10,10,10,0.05) 55%,
      rgba(10,10,10,0.78) 88%,
      rgba(10,10,10,0.95) 100%
    );
  }

  .lifestyle-stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 80px 96px;
  }

  .lifestyle-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lifestyle-top .tag {
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .lifestyle-body {
    margin-top: auto;
    max-width: 820px;
  }

  .lifestyle-eyebrow {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .lifestyle-eyebrow::before {
    content: "";
    width: 44px;
    height: 1px;
    background: var(--accent);
  }

  .lifestyle-headline {
    font-family: var(--display);
    font-weight: 400;
    font-style: italic;
    font-size: 128px;
    line-height: .9;
    letter-spacing: -.04em;
    color: var(--text);
    margin-bottom: 32px;
    /* Bigger text-shadow than photo-cover-card — light gradient means
       less contrast against the photo, so the type needs help. */
    text-shadow: 0 4px 28px rgba(0,0,0,0.65);
    max-width: 820px;
  }
  .lifestyle-headline em {
    color: var(--accent);
    font-weight: 300;
  }
  body[data-size="story"] .lifestyle-headline { font-size: 168px; }

  .lifestyle-sub {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.3;
    color: var(--text);
    max-width: 600px;
    opacity: .92;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
  }
  .lifestyle-sub em { color: var(--accent); }
  body[data-size="story"] .lifestyle-sub { font-size: 36px; max-width: 720px; }

  /* No site URL / no CTA — the IG caption is the call to action.
     The card itself stays cinematic. */

  .lifestyle-credit {
    position: absolute;
    bottom: 22px;
    right: 28px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text);
    opacity: .55;
    z-index: 2;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
</style>
</head>
<body data-size="{{size}}">
  <div class="stage">

    <div class="lifestyle-photo">
      <img src="{{photo_url}}" alt="">
    </div>

    <div class="lifestyle-stage">

      <div class="lifestyle-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">SMARTERPICKS</span>
        </div>
        <div class="tag">{{tag}}</div>
      </div>

      <div class="lifestyle-body">
        <div class="lifestyle-eyebrow">{{eyebrow}}</div>
        <div class="lifestyle-headline">{{headline_html}}</div>
        <div class="lifestyle-sub">{{sub_html}}</div>
      </div>

    </div>

    <div class="lifestyle-credit">{{photo_credit}}</div>

  </div>
</body>
</html>
