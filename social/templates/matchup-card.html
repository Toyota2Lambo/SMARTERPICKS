<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Matchup Card</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* MATCHUP CARD — head-to-head comparison.
     Three-column grid: Team A | vs pivot | Team B. Each side
     carries name (italic serif), record (mono), and one head-
     line stat (mono numeric). A horizontal-rule callout at the
     bottom names "The Play". Symmetric, balanced composition —
     reads like a fight-card poster rendered for a literary
     monthly. The favored side gets the accent treatment on its
     name so the eye knows which way to lean without anyone
     having to say it. */

  .stage { padding: 88px 80px; }
  .brand { margin-bottom: 0; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vs-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 28px;
    margin: 80px 0 auto;
  }

  .team {
    text-align: center;
    padding: 32px 16px;
  }
  /* Team logo above the name. Both teams get one. The favored side
     still differentiates via gold name color + accent stat. Logo PNG
     comes from ESPN's CDN (resolved by team_logos.py). If the URL
     fails to load, onerror hides the img and the slot collapses to
     the surrounding padding. */
  .team-logo {
    width: 132px;
    height: 132px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .team-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* Slight drop-shadow so the logo lifts off the dark canvas */
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .team-logo img[src=""],
  .team-logo img:not([src]) {
    display: none;
  }
  body[data-size="story"] .team-logo {
    width: 168px;
    height: 168px;
  }
  .team-name {
    font-family: var(--display);
    font-weight: 400;
    font-style: italic;
    font-size: 92px;
    line-height: .94;
    letter-spacing: -.03em;
    color: var(--text);
    margin-bottom: 28px;
  }
  body[data-size="story"] .team-name { font-size: 112px; }
  .team.favored .team-name { color: var(--accent); font-weight: 300; }

  .team-record {
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 36px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .team-record::before, .team-record::after {
    content: "";
    width: 14px;
    height: 1px;
    background: var(--border);
  }

  .team-stat {
    font-family: var(--mono);
    font-size: 60px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.02em;
    line-height: 1;
  }
  .team.favored .team-stat { color: var(--accent); }
  .team-stat-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 14px;
  }

  .vs-pivot {
    font-family: var(--display);
    font-style: italic;
    font-weight: 300;
    font-size: 108px;
    color: var(--accent);
    line-height: 1;
    opacity: .9;
    transform: translateY(-12px);
  }
  body[data-size="story"] .vs-pivot { font-size: 128px; }

  .play-callout {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 38px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
  }
  .play-label {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .play-value {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 60px;
    color: var(--accent);
    letter-spacing: -.02em;
    line-height: 1;
  }
  body[data-size="story"] .play-value { font-size: 72px; }
</style>
</head>
<body data-size="{{size}}">
  <div class="stage">

    <div class="header-row">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">SMARTERPICKS</span>
      </div>
      <div class="tag">{{tag}}</div>
    </div>

    <div class="vs-wrap">
      <div class="team {{team_a_class}}">
        <!-- Team logo (resolved by social_generator → team_logos.py).
             Falls back to the inset-photo box if logo URL is empty. -->
        <div class="team-logo"><img src="{{team_a_logo}}" alt="" onerror="this.style.display='none'"></div>
        <div class="team-name">{{team_a}}</div>
        <div class="team-record">{{record_a}}</div>
        <div class="team-stat">{{stat_a}}</div>
        <div class="team-stat-label">{{stat_label}}</div>
      </div>

      <div class="vs-pivot">vs</div>

      <div class="team {{team_b_class}}">
        <div class="team-logo"><img src="{{team_b_logo}}" alt="" onerror="this.style.display='none'"></div>
        <div class="team-name">{{team_b}}</div>
        <div class="team-record">{{record_b}}</div>
        <div class="team-stat">{{stat_b}}</div>
        <div class="team-stat-label">{{stat_label}}</div>
      </div>
    </div>

    <div class="play-callout">
      <div class="play-label">The Play</div>
      <div class="play-value">{{the_play}}</div>
    </div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      <span class="promo">7-day free trial</span>
    </div>

  </div>
</body>
</html>
