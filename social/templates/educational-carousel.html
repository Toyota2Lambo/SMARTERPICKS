<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarterPicks — Educational Carousel</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* educational-carousel: editorial slide for 5-slide explainer carousels.
     Renderer calls per slide with:
       {{topic}}        — the carousel topic (shown small at the top)
       {{slide_text}}   — the slide's content (1-3 lines)
       {{slide_index}}  — current slide number
       {{slide_total}}  — total slides (5)
       {{slide_role}}   — "title" | "setup" | "insight" | "example" | "payoff"
                          (used to nudge the visual treatment per slide) */
  .edu-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    position: relative;
    z-index: 1;
  }
  .edu-topic {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-muted);
    max-width: 75%;
  }
  .edu-headline {
    font-family: var(--display);
    font-weight: 400;
    letter-spacing: -.02em;
    line-height: 1.06;
    color: var(--text);
    font-size: 76px;
  }
  body[data-size="story"] .edu-headline { font-size: 92px; }
  .edu-headline em {
    font-style: italic;
    color: var(--accent);
    font-weight: 300;
  }

  /* Title slide (index=1) — overscale headline, no body. */
  body[data-slide="1"] .edu-headline { font-size: 96px; }
  body[data-slide="1"][data-size="story"] .edu-headline { font-size: 116px; }

  /* Payoff slide (index=5) — accent stripe to make the "ending" feel like one. */
  body[data-slide="5"] .edu-body::before {
    content: "";
    position: absolute;
    left: -80px;
    top: 0;
    bottom: 0;
    width: 6px;
    background: var(--accent);
  }

  .edu-pager {
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .edu-pager .num { color: var(--accent); }
  .edu-pager .pips {
    display: flex;
    gap: 6px;
    margin-left: 8px;
  }
  .edu-pager .pip {
    width: 16px;
    height: 3px;
    background: var(--border);
  }
  .edu-pager .pip.active { background: var(--accent); }
</style>
</head>
<body data-size="{{size}}" data-slide="{{slide_index}}">
  <div class="glow" style="top:18%;right:-12%;width:480px;height:480px;"></div>
  <div class="stage">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">SMARTERPICKS</span>
    </div>

    <div class="tag">{{slide_role}} · Slide <span style="color:var(--text);">{{slide_index}}</span></div>

    <div class="edu-body">
      <div class="edu-topic">{{topic}}</div>
      <div class="edu-headline">{{slide_text}}</div>
    </div>

    <div class="edu-pager">
      <span><span class="num">{{slide_index}}</span> / {{slide_total}}</span>
      <span class="pips">{{pips_html}}</span>
    </div>

    <div class="footer">
      smarterpicks.io <span class="dot">·</span>
      Save this <span class="dot">·</span>
      Code <span class="promo">free trial</span>
    </div>
  </div>
</body>
</html>
